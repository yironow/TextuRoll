<!DOCTYPE html>
<html>
<head>
<title>TextuRoll House</title>
</head>
<body>

<h1>Welcome to TextuRoll</h1>
<p>Generate new texture here↓.</p>

<canvas id="GenPlace" width="1024" height="1024" ></canvas>


<button id="Generate" type="button">Generate</button>

<script>
  const canvas = document.getElementById("GenPlace");
  const ctx = canvas.getContext("2d");
  const BtnG = document.getElementById("Generate");

  const HW = 2
  

  BtnG.addEventListener("click", () => {

    const PatternWood = [
        "PatternWood0.png",
        "PatternWood1.png",
        "PatternWood2.png",
        "PatternWood3.png"
    ];
    const CelWidth = canvas.width / 2;
    const CelHeight = canvas.height / 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    PatternWood.forEach((Path, iN) => {
        const img = new Image();
        img.src = Path;

        img.onload = () => {

          const Columns = indice % 2;
          const PathF = Math.floor(iN / 2);
          
          const x = Columns * CelWidth;
          const y = PathF * CelHeight;


          ctx.drawImage(img, x, y, CelWidth, CelHeight);
        };
    });
});
    
</script>
</body>
</html>
